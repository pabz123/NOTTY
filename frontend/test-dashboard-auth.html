<!DOCTYPE html>
<html>
<head>
    <title>Dashboard Auth Test</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; margin: 5px; }
        input { padding: 8px; margin: 5px 0; width: 300px; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🔍 Dashboard Auth Test</h1>
    
    <div id="backendStatus" class="status info">
        Checking backend...
    </div>
    
    <hr>
    
    <h2>Test Dashboard.js Login</h2>
    <input type="email" id="testEmail" placeholder="Email" value="test@test.com">
    <br>
    <input type="password" id="testPassword" placeholder="Password" value="test123">
    <br>
    <button onclick="testLogin()">Test Login</button>
    <button onclick="testRegister()">Test Register</button>
    
    <div id="result"></div>
    
    <hr>
    
    <h2>Console Log</h2>
    <pre id="log"></pre>
    
    <script>
        const API_BASE = 'http://127.0.0.1:8000';
        let log = [];
        
        function addLog(msg) {
            const time = new Date().toLocaleTimeString();
            log.push(`[${time}] ${msg}`);
            document.getElementById('log').textContent = log.join('\n');
            console.log(msg);
        }
        
        // Check backend
        fetch(`${API_BASE}/docs`)
            .then(() => {
                document.getElementById('backendStatus').className = 'status success';
                document.getElementById('backendStatus').textContent = '✅ Backend is running';
                addLog('Backend: CONNECTED');
            })
            .catch(err => {
                document.getElementById('backendStatus').className = 'status error';
                document.getElementById('backendStatus').textContent = '❌ Backend is NOT running!';
                addLog('Backend: FAILED - ' + err.message);
            });
        
        async function testLogin() {
            const email = document.getElementById('testEmail').value;
            const password = document.getElementById('testPassword').value;
            const resultDiv = document.getElementById('result');
            
            addLog(`Testing login: ${email}`);
            resultDiv.innerHTML = '<div class="status info">Testing login...</div>';
            
            try {
                addLog('Calling /auth/login');
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                addLog(`Response status: ${response.status}`);
                const data = await response.json();
                addLog(`Response: ${JSON.stringify(data)}`);
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="status success">
                            <h3>✅ Login Successful!</h3>
                            <p>Token: ${data.access_token.substring(0, 50)}...</p>
                            <p>Token type: ${data.token_type}</p>
                        </div>
                    `;
                    localStorage.setItem('authToken', data.access_token);
                    addLog('Token saved to localStorage');
                } else {
                    resultDiv.innerHTML = `
                        <div class="status error">
                            <h3>❌ Login Failed</h3>
                            <p>Error: ${data.detail || JSON.stringify(data)}</p>
                        </div>
                    `;
                }
            } catch (error) {
                addLog(`ERROR: ${error.message}`);
                resultDiv.innerHTML = `
                    <div class="status error">
                        <h3>❌ Network Error</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }
        
        async function testRegister() {
            const email = document.getElementById('testEmail').value;
            const password = document.getElementById('testPassword').value;
            const resultDiv = document.getElementById('result');
            
            addLog(`Testing register: ${email}`);
            resultDiv.innerHTML = '<div class="status info">Testing registration...</div>';
            
            try {
                addLog('Calling /auth/register');
                const response = await fetch(`${API_BASE}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                addLog(`Response status: ${response.status}`);
                const data = await response.json();
                addLog(`Response: ${JSON.stringify(data)}`);
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="status success">
                            <h3>✅ Registration Successful!</h3>
                            <p>Token: ${data.access_token.substring(0, 50)}...</p>
                            <p>Token type: ${data.token_type}</p>
                            <p>Now try logging in!</p>
                        </div>
                    `;
                    localStorage.setItem('authToken', data.access_token);
                    addLog('Token saved to localStorage');
                } else {
                    resultDiv.innerHTML = `
                        <div class="status error">
                            <h3>❌ Registration Failed</h3>
                            <p>Error: ${data.detail || JSON.stringify(data)}</p>
                        </div>
                    `;
                }
            } catch (error) {
                addLog(`ERROR: ${error.message}`);
                resultDiv.innerHTML = `
                    <div class="status error">
                        <h3>❌ Network Error</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }
        
        addLog('Test page loaded');
    </script>
</body>
</html>
