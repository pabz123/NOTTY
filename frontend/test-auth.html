<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Registration Test</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
        input { padding: 8px; margin: 5px 0; width: 300px; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🔍 Registration/Login Test Page</h1>
    
    <div id="backendStatus" class="status info">
        Checking backend connection...
    </div>
    
    <hr>
    
    <h2>Test Registration</h2>
    <input type="email" id="regEmail" placeholder="Email" value="test@example.com">
    <br>
    <input type="password" id="regPassword" placeholder="Password" value="password123">
    <br>
    <button onclick="testRegister()">Test Register</button>
    
    <div id="registerResult"></div>
    
    <hr>
    
    <h2>Test Login</h2>
    <input type="email" id="loginEmail" placeholder="Email" value="test@example.com">
    <br>
    <input type="password" id="loginPassword" placeholder="Password" value="password123">
    <br>
    <button onclick="testLogin()">Test Login</button>
    
    <div id="loginResult"></div>
    
    <hr>
    
    <h2>Console Log</h2>
    <pre id="consoleLog"></pre>
    
    <script>
        const API_BASE = 'http://127.0.0.1:8000';
        let log = [];
        
        function addLog(message) {
            const timestamp = new Date().toLocaleTimeString();
            log.push(`[${timestamp}] ${message}`);
            document.getElementById('consoleLog').textContent = log.join('\n');
        }
        
        // Check backend on load
        fetch(`${API_BASE}/docs`)
            .then(() => {
                document.getElementById('backendStatus').className = 'status success';
                document.getElementById('backendStatus').textContent = '✅ Backend is running at ' + API_BASE;
                addLog('Backend connection: SUCCESS');
            })
            .catch(err => {
                document.getElementById('backendStatus').className = 'status error';
                document.getElementById('backendStatus').textContent = '❌ Backend is NOT running! Start it first.';
                addLog('Backend connection: FAILED - ' + err.message);
            });
        
        async function testRegister() {
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const resultDiv = document.getElementById('registerResult');
            
            addLog(`Attempting registration for: ${email}`);
            resultDiv.innerHTML = '<div class="status info">Registering...</div>';
            
            try {
                addLog('Sending POST to /auth/register');
                const response = await fetch(`${API_BASE}/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });
                
                addLog(`Response status: ${response.status} ${response.statusText}`);
                const data = await response.json();
                addLog(`Response data: ${JSON.stringify(data)}`);
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="status success">
                            <h3>✅ Registration Successful!</h3>
                            <p><strong>Token:</strong> ${data.access_token.substring(0, 50)}...</p>
                            <p>You can now try logging in with these credentials.</p>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="status error">
                            <h3>❌ Registration Failed</h3>
                            <p><strong>Status:</strong> ${response.status}</p>
                            <p><strong>Error:</strong> ${data.detail || JSON.stringify(data)}</p>
                        </div>
                    `;
                }
            } catch (error) {
                addLog(`ERROR: ${error.message}`);
                resultDiv.innerHTML = `
                    <div class="status error">
                        <h3>❌ Network Error</h3>
                        <p><strong>Error:</strong> ${error.message}</p>
                        <p>Make sure the backend is running!</p>
                    </div>
                `;
            }
        }
        
        async function testLogin() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const resultDiv = document.getElementById('loginResult');
            
            addLog(`Attempting login for: ${email}`);
            resultDiv.innerHTML = '<div class="status info">Logging in...</div>';
            
            try {
                addLog('Sending POST to /auth/login');
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });
                
                addLog(`Response status: ${response.status} ${response.statusText}`);
                const data = await response.json();
                addLog(`Response data: ${JSON.stringify(data)}`);
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="status success">
                            <h3>✅ Login Successful!</h3>
                            <p><strong>Token:</strong> ${data.access_token.substring(0, 50)}...</p>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="status error">
                            <h3>❌ Login Failed</h3>
                            <p><strong>Status:</strong> ${response.status}</p>
                            <p><strong>Error:</strong> ${data.detail || JSON.stringify(data)}</p>
                        </div>
                    `;
                }
            } catch (error) {
                addLog(`ERROR: ${error.message}`);
                resultDiv.innerHTML = `
                    <div class="status error">
                        <h3>❌ Network Error</h3>
                        <p><strong>Error:</strong> ${error.message}</p>
                        <p>Make sure the backend is running!</p>
                    </div>
                `;
            }
        }
        
        addLog('Test page loaded successfully');
        addLog('Click buttons above to test registration/login');
    </script>
</body>
</html>
